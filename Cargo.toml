[package]
name = "hdmi-hal-i2c-dev"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Linux userspace hdmi-hal backend via /dev/i2c-N (i2c-dev)"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/hdmi-hal-i2c-dev"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "i2c", "linux", "scdc"]
categories = ["hardware-support", "embedded", "os::linux-apis"]

[package.metadata.docs.rs]
all-features = true

[features]
integration = []

[dependencies]
display-types = ">=0.4.3, <0.6"
hdmi-hal = "0.6"
i2cdev = "0.6.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Prototype against hdmi-hal's unreleased breaking release: a pushed commit of its
# feat/tmds-phy branch, moved by hand. Removed when hdmi-hal is released; CI on main and the
# publish workflow fail while it is here.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "29754ce9ec60c54f86170ebd43729e7fbaee043f" }
